<header>
  <h2>Ops Pilot</h2>
  <nav>
    <a routerLink="/dashboard">Dash Board</a>
    <a routerLink="/incidents">Incidents</a>
    @if(flags.approvalsEnabled===true){
      <a routerLink="/approvals">Approvals</a>
    }
    
    <a routerLink="/assets">Assets</a>
    @if(flags.auditEnabled===true){
      <a routerLink="/audit">Audit</a>
    }
    
  </nav>
</header>
<main>
  <router-outlet />
  <button (click)="loginasAdmin()">
    Login
  </button>
  @if(authService.currentUser(); as user){
    <p>{{user.name}}-{{user.role}}</p>
  }
</main>
